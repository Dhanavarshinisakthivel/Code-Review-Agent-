# Server will run on this port -> http://localhost:8080
server.port=8080

# Your Google Gemini API key. NEVER hardcode the real key here.
# We read it from an environment variable called GEMINI_API_KEY instead.
gemini.api.key=gemini.api.key=${GEMINI_API_KEY}

# Which Gemini model to use for reviews
gemini.model=gemini-2.5-flash
