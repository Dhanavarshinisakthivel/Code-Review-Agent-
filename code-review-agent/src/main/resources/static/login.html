<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - AI Code Review Agent</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="centered-page">

<div class="login-box">
  <h1>🔍 AI Code Review Agent</h1>
  <p class="subtitle">Log in to continue</p>

  <label for="username">Username</label>
  <input type="text" id="username" placeholder="student">

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="password123">

  <button id="loginBtn">Log In</button>
  <p id="loginError" class="error"></p>

  <p class="hint">Demo credentials: <b>student</b> / <b>password123</b></p>
</div>

<script src="login.js"></script>
</body>
</html>
